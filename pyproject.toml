[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-sync"
version = "0.1.0"
description = "Personal knowledge synchronization and organization tool"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "requests>=2.31",
]

[project.scripts]
ksync = "main:main"
ksync-ui = "ui:main"
ksync-web = "web_ui:main"

[tool.setuptools]
packages = ["ksync", "config"]
py-modules = ["main", "ui", "web_ui"]
